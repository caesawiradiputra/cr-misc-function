name: Python CI

on:
  push:
    branches: ["master", "dev", "sit"]
  pull_request:
    branches: ["master", "dev", "sit"]

jobs:
  lint-and-typecheck:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Conda
        uses: conda-incubator/setup-miniconda@v3
        with:
          python-version: "3.11"
          activate-environment: ci
          environment-file: environment.yml
          auto-update-conda: true

      - name: Verify Python
        shell: bash -l {0}
        run: |
          python --version
          which python

      - name: Ruff lint
        shell: bash -l {0}
        run: |
          ruff check .

      - name: Ruff format check
        shell: bash -l {0}
        run: |
          ruff format --check .

      - name: mypy
        shell: bash -l {0}
        run: |
          mypy .

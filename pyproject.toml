    "loguru (>=0.7.3,<0.8.0)",
    "pyodbc (>=5.2.0,<6.0.0)",
    "pyodps (>=0.12.4,<0.13.0)",
    "trino (>=0.335.0,<0.336.0)",
    "pyhive (>=0.7.0,<0.8.0)",
    "sqlalchemy (>=2.0.41,<3.0.0)",
    "psycopg2-binary (>=2.9.10,<3.0.0)",
    "mysql-connector-python (>=9.3.0,<10.0.0)",
    "pandas (>=2.3.1,<3.0.0)",
    "asyncio (>=3.4.3,<4.0.0)",
    "thrift (>=0.22.0,<0.23.0)",

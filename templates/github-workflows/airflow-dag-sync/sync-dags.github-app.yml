# Template (GitHub App variant): Sync DAGs to the Airflow deployment repository
#
# Same behaviour as sync-dags.yml, but the write token is not a stored PAT: each run asks a
# GitHub App for a one-hour installation token limited to the deployment repository. Use this
# when an organization admin can create and install the App (see the standard, section 4).
#
# Copies one DAG (a DAG file plus its helper folder) from this repository into the shared
# Airflow deployment repository, so Data Ops deploys it from there. Rules and setup:
# docs/guidelines/AIRFLOW-DAG-SYNC-STANDARD.md in cr-misc-function.
#
# Files to copy together:
#   .github/workflows/sync-dags.yml   (this file)
#   scripts/sync_dags.sh
#   scripts/publish_dags.sh
# Then replace every TODO in the env block below and keep the repository layout
# dags/<DAG_EXECUTOR> + dags/<DAG_UTILS>/ .
#
# Targets:
#   push to master     -> force-updates the branch sync/<DAG_SLUG> of the deployment repository and
#                         opens (or reuses) a pull request into its master; Data Ops merges it
#   push to dev or sit -> pushes straight to the deployment repository's development branch
#   any other branch   -> dry run only: no token, nothing is pushed
#
# Required in this repository (Settings > Environments):
#   - the secrets DA_AIRFLOW_SYNC_APP_CLIENT_ID (Client ID of the GitHub App) and
#     DA_AIRFLOW_SYNC_APP_PRIVATE_KEY (its private key, PEM), either as organization secrets
#     shared with this repository, or in the Environment "airflow-sync" (deployment branches
#     limited to master, dev and sit). The organization secrets are easier to manage but readable
#     from every branch, so they bypass the Environment's branch restriction.
#   The App is installed on the deployment repository only, with Contents and Pull requests
#   read and write. Do NOT also store the key as a repository-level secret.

name: Sync DAGs to the deployment repository (GitHub App)

on:
  push:
    branches: [master, dev, sit]
    paths:
      - "dags/**"
      - "scripts/sync_dags.sh"
      - "scripts/publish_dags.sh"
      - ".github/workflows/sync-dags.yml"
  workflow_dispatch:

# The built-in token only reads this repository. Write access to the deployment repository comes
# from a GitHub App token created in the job, using the "airflow-sync" Environment's key.
permissions:
  contents: read

# One run at a time per target, queued rather than cancelled: two runs on the same target would
# race on the same branch. The group names are labels, not branch names.
concurrency:
  group: sync-dags-${{ github.ref_name == 'master' && 'master' || 'airflow-dev' }}
  cancel-in-progress: false

env:
  DEPLOY_REPO: "<ORG>/<DEPLOYMENT_REPO>"       # TODO: owner/name of the Airflow deployment repository
  DEPLOY_DEV_BRANCH: "airflow-dev"             # TODO: branch of that repository that dev and sit publish to
  DAG_DEST_DIR: "airflow/dags"                 # TODO: DAG folder inside the deployment repository
  DAG_SLUG: "<dag-slug>"                       # TODO: short kebab-case name; becomes the sync/<slug> branch
  DAG_EXECUTOR: "<dag_id>_executor.py"         # TODO: the DAG file under dags/
  DAG_UTILS: "<dag_id>_utils"                  # TODO: the helper folder under dags/

jobs:
  sync:
    if: github.ref_name == 'master' || github.ref_name == 'dev' || github.ref_name == 'sit'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: airflow-sync
    steps:
      - name: Checkout this repository
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Resolve the target branch and mode
        id: target
        env:
          REF_NAME: ${{ github.ref_name }}
        shell: bash
        run: |
          case "$REF_NAME" in
            master) base=master; mode=pr ;;
            dev | sit) base="$DEPLOY_DEV_BRANCH"; mode=direct ;;
            *) echo "unexpected ref $REF_NAME" >&2; exit 1 ;;
          esac
          echo "base=$base" >> "$GITHUB_OUTPUT"
          echo "mode=$mode" >> "$GITHUB_OUTPUT"
          echo "owner=${DEPLOY_REPO%%/*}" >> "$GITHUB_OUTPUT"
          echo "repo=${DEPLOY_REPO##*/}" >> "$GITHUB_OUTPUT"

      - name: Create the deployment repository token (GitHub App)
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ secrets.DA_AIRFLOW_SYNC_APP_CLIENT_ID }}
          private-key: ${{ secrets.DA_AIRFLOW_SYNC_APP_PRIVATE_KEY }}
          owner: ${{ steps.target.outputs.owner }}
          repositories: ${{ steps.target.outputs.repo }}
          permission-contents: write
          permission-pull-requests: write

      - name: Clone the deployment repository
        env:
          DEPLOY_TOKEN: ${{ steps.app-token.outputs.token }}
          BASE: ${{ steps.target.outputs.base }}
        shell: bash
        run: |
          git clone --quiet --branch "$BASE" \
            "https://x-access-token:${DEPLOY_TOKEN}@github.com/${DEPLOY_REPO}.git" "$RUNNER_TEMP/deploy"

      - name: Publish the DAG files
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          MODE: ${{ steps.target.outputs.mode }}
          BASE: ${{ steps.target.outputs.base }}
          SOURCE_SHA: ${{ github.sha }}
        shell: bash
        run: |
          {
            echo "## DAG sync"
            echo ""
            echo "- Source: ${GITHUB_REPOSITORY}@${SOURCE_SHA}"
            echo "- Target: ${DEPLOY_REPO} branch ${BASE} (${MODE})"
            echo ""
          } | tee -a "$GITHUB_STEP_SUMMARY"
          bash scripts/publish_dags.sh "$GITHUB_WORKSPACE" "$RUNNER_TEMP/deploy" "$MODE" "$BASE" "$SOURCE_SHA" \
            | tee -a "$GITHUB_STEP_SUMMARY"

  dry-run:
    if: github.ref_name != 'master' && github.ref_name != 'dev' && github.ref_name != 'sit'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout this repository
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Show what a sync would copy (no token, nothing is pushed)
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/deploy/$DAG_DEST_DIR"
          bash scripts/sync_dags.sh "$GITHUB_WORKSPACE" "$RUNNER_TEMP/deploy" | tee -a "$GITHUB_STEP_SUMMARY"
          find "$RUNNER_TEMP/deploy/$DAG_DEST_DIR" -type f | sort | tee -a "$GITHUB_STEP_SUMMARY"

## DBHub config for sqlserver. Copy to `.claude/dbhub.toml`. It holds no secrets: the values come
## from the environment that `.mcp.json` fills from `.env` (rename the variables to the app's own).
[[sources]]
id = "sqlserver"
type = "sqlserver"
host = "${SQLSERVER_HOST}"
database = "${SQLSERVER_NAME}"
user = "${SQLSERVER_USER}"
password = "${SQLSERVER_PASSWORD}"
## Default port is used. For another port, check the DBHub docs for the `port` key.

## Read-only: only SELECT, SHOW, DESCRIBE and EXPLAIN are allowed, and the result size is capped.
[[tools]]
name = "execute_sql"
source = "sqlserver"
readonly = true
max_rows = 1000

[[tools]]
name = "search_objects"
source = "sqlserver"

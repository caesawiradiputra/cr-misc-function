[mypy]
python_version = 3.11

ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_return_any = true
no_implicit_optional = true
strict_equality = true

# Data engineering reality
disallow_untyped_defs = false
check_untyped_defs = false

## The repo root has an __init__.py and a hyphenated folder name, which makes
## `mypy .` abort ("not a valid Python package name") without this.
explicit_package_bases = true

## .venv/.conda/build/dist are large or generated. temp/pyODPS holds DataWorks
## PyODPS node scripts that rely on runtime-injected globals (o, args, DataFrame).
exclude = (?x)(^.venv/ |^.conda/ |^build/ |^dist/ |^temp/pyODPS/)
